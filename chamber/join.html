<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apply for a membership with the Quist Chamber of Commerce. Choose from NP, Bronze, Silver, or Gold levels to grow your business.">
    <meta name="author" content="Crash Rosquist">
    <title>Join the Quist Chamber of Commerce | Membership Application</title>

    <meta property="og:title" content="Quist Chamber Of Commerce">
    <meta property="og:type" content="website">
    <meta property="og:description"
        content="Welcome to the Quist Chamber of Commerce. Explore our community, weather, and local businesses.">
    <meta property="og:image" content="https://crashrosquist-crypto.github.io/wdd231/chamber/images/hero.jpg">
    <meta property="og:url" content="https://crashrosquist-crypto.github.io/wdd231/chamber/index.html">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <script src="scripts/main.js" type="module"></script>
    <script src="scripts/join.js" type="module"></script>
</head>

<body>
    <header>
        <img src="images/cheese.svg" alt="Quist Chamber Logo">
        <p>Quist Chamber Of Commerce</p>
        <button id="nav-button" class="hamburger" aria-label="Toggle Navigation"></button>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li class="active"><a href="index.html">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="join.html">Join</a></li>
                <li><a href="discover.html">Discover</a></li>
            </ul>
        </nav>
    </header>
    <main>
    <h1 class="membership-text">Chamber Membership Application</h1>
    <div class="join-container">
    <section class="form-section">
        <h2>Application Form</h2>
        <form method="get" action="thankyou.html">
            
            <label>First Name:
                <input name="firstName" id="firstName" type="text" required autocomplete="given-name" title="Enter your first name" placeholder="Jane">
            </label>

            <label>Last Name:
                <input name="lastName" id="lastName" type="text" required autocomplete="family-name" title="Enter your last name" placeholder="Doe">
            </label>

            <label>Organizational Title:
                <input type="text" id="orgTitle" name="orgTitle" 
                pattern="[A-Za-z\s\-]{7,}" 
                title="Minimum 7 characters (letters, spaces, or hyphens only)" 
                autocomplete="organization-title">
            </label>

            <label>Mobile Phone Number:
                <input type="tel" id="phone" name="phone" required 
                title="Please enter your mobile phone number" 
                autocomplete="tel">
            </label>

            <label>Business/Organization Name:
                <input type="text" id="orgName" name="orgName" required 
                title="Enter your business name" 
                autocomplete="organization">
            </label>

            <label>Email:
                <input name="email" id="email" type="email" required
                title="Please enter your email" 
                placeholder="example@email.com" 
                autocomplete="email">
            </label>

            <label>Membership Level:
                <select id="membership" name="membership" required>
                    <option value="" selected disabled>Select a Level...</option>
                    <option value="np">Non-Profit (NP)</option>
                    <option value="bronze">Bronze</option>
                    <option value="silver">Silver</option>
                    <option value="gold">Gold</option>
                </select>
            </label>

            <label>Business Description:
                <textarea id="description" name="description" title="Tell us about your organization"></textarea>
            </label>

            <input type="hidden" id="timestamp" name="timestamp">

            <input type="submit" value="Join the Chamber" class="submitBtn">
            
        </form>
    </section>

    <section class="membership-cards">
        <h3>Membership Levels</h3>
        </section>
</div>
</main>




    <footer>
        <div class="footer-info">
            <p>&copy; <span id="currentyear"></span> | Crash Rosquist | WDD 231 Project</p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>

</html>
