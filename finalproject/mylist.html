<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHut | My List</title>
    <meta name="description" content="View and manage your personal collection of saved anime on AnimeHut.">
    <meta name="author" content="Crash Rosquist">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script src="scripts/mylist.js" type="module"></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/favicon.ico" alt="AnimeHut Logo">
        </div> 
        <h1>AnimeHut</h1>
        
        <button id="menu-button" aria-label="Toggle Menu">&#9776;</button>

        <nav class="main-nav">
            <ul id="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="mylist.html" class="active">My List</a></li>
            </ul>
        </nav>
        <div class="search-container">
            <form action="search.html" method="GET">
                <label for="anime-search" class="visually-hidden">Search Anime</label>
                <input type="text" name="query" id="main-search-input" placeholder="Search for an anime..." required>
                <button type="submit" id="search-button">Search</button>
            </form>
        </div>
        
        
    </header>

    <main>
        <section class="list-header">
            <h2>My Saved Anime</h2>
            <p id="list-count">You have 0 items in your list.</p>
            <button id="clear-list" class="btn">Clear All</button>
        </section>

        <div id="mylist-grid" class="anime-results-grid">
            <p>Your list is currently empty. Go to the <a href="search.html">Search page</a> to add some!</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 | AnimeHut | WDD 231 Final Project</p>
        <p>Data provided by <a href="https://jikan.moe/">Jikan API</a></p>
        <a href="https://youtu.be/qPaWDbqFn7M" class="video-link">Project Video Demonstration</a>
    </footer>
    
    <dialog id="anime-modal">
        <div class="modal-content">
            <button id="close-modal" aria-label="Close Modal">&times;</button>
            <div id="modal-details">
                </div>
        </div>
    </dialog>
</body>
</html>
