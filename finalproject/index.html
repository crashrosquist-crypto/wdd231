<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHut | Home</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="description" content="Discover trending anime, ratings, and details at AnimeHut.">
    <meta name="author" content="Crash Rosquist">
    <meta property="og:title" content="AnimeHut | Discover Your Next Favorite Series">
    <meta property="og:description" content="Discover your next favorite series at AnimeHut. Explore trending titles, detailed ratings, and curated lists for every anime fan.">
    <meta property="og:image" content="https://crashrosquist-crypto.github.io/wdd231/finalproject/images/og-image.jpg">
    <meta property="og:url" content="https://crashrosquist-crypto.github.io/wdd231/finalproject/index.html">
    <meta property="og:type" content="website">    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script src="scripts/main.js" type="module"></script>
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/favicon.ico" alt="AnimeHut Logo">
        </div>
        <h1>AnimeHut</h1>

        <button id="menu-button" aria-label="Toggle Menu">&#9776;</button>

        <nav class="main-nav">
            <ul id="nav-list">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="mylist.html">My List</a></li>
            </ul>
        </nav>
        <div class="search-container">
            <form action="search.html" method="GET">
                <label for="anime-search" class="visually-hidden">Search Anime</label>
                <input type="text" name="query" id="anime-search" placeholder="Search for an anime..." required>
                <button type="submit" id="search-btn">Search</button>
            </form>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h2>Filters</h2>
            <ul id="filter-list">
                <li><button class="filter-btn" data-genre="Action">Action</button></li>
                <li><button class="filter-btn" data-genre="Adventure">Adventure</button></li>
                <li><button class="filter-btn" data-genre="Sci-Fi">Sci-Fi</button></li>
                <li><button class="filter-btn" data-genre="Fantasy">Fantasy</button></li>
                <li><button class="filter-btn" data-genre="all">Clear Filters</button></li>
            </ul>
        </aside>

        <main>
            <section class="hero">
                <h3>Featured Anime of the Month</h3>
                <div id="hero-content">
                    <p>Loading featured anime...</p>
                </div>
            </section>

            <div class="section-banner">
                <h2>Trending Anime</h2>
            </div>

            <section class="anime-grid" id="anime-list">
                <h2>Reccomended Anime</h2>
            </section>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Anime Discovery Hub | Content via External API</p>
        <a href="https://youtu.be/qPaWDbqFn7M" class="video-link">Project Video Demonstration</a>
    </footer>

    <dialog id="anime-modal">
        <div class="modal-content">
            <button id="close-modal" aria-label="Close Modal">&times;</button>
            <div id="modal-details">
                </div>
        </div>
    </dialog>
</body>

</html>
