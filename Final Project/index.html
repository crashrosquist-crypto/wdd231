<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Discovery Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🎏</div> <h1>Anime Discovery Hub</h1>
        <nav class="main-nav">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Browse</a></li>
        </ul>
</nav>
        <div class="search-container">
            <form class="search-container" action="search.html" method="GET">
                <input type="text" name="query" id="anime-search" placeholder="Search for an anime...">
                <button type="submit" id="search-btn">Search</button>
            </form>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Filters</h3>
            <ul>
                <li>Action</li>
                <li>Adventure</li>
                <li>Sci-Fi</li>
                <li>Fantasy</li>
            </ul>
        </aside>

        <main>
            <section class="hero">
                <h2>Featured Anime of the Month</h2>
                <div id="hero-content">
                    <p>Loading featured anime...</p>
                </div>
            </section>

            <section class="anime-grid" id="anime-list">
                </section>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Anime Discovery Hub | Content via External API</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
